openapi: 3.0.3
info:
  title: API de Gestión de Casos de Soporte
  description: API interna para el seguimiento de tickets importantes, productos, comentarios y archivos adjuntos.
  version: 1.0.0
servers:
  - url: http://localhost:3002/api
    description: Servidor de desarrollo local

paths:
  /health:
    get:
      summary: Verificación del estado del servidor
      description: Retorna el estado de salud de la API y de la base de datos.
      responses:
        '200':
          description: Servidor operativo
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  timestamp:
                    type: string
                    format: date-time
                  database:
                    type: string
                    example: connected

  /cases:
    get:
      summary: Obtener todos los casos
      description: Devuelve una lista de todos los casos de soporte ordenados por importancia y fecha de creación.
      responses:
        '200':
          description: Lista de casos obtenida con éxito
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CaseResponse'
        '500':
          $ref: '#/components/responses/500InternalError'
          
    post:
      summary: Crear un nuevo caso
      description: Registra un caso en el sistema con validación de campos obligatorios.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaseCreate'
      responses:
        '201':
          description: Caso creado con éxito
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    example: 42
                  message:
                    type: string
                    example: Case created successfully
        '400':
          description: Error de validación o número de caso duplicado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/500InternalError'

  /cases/important/comments:
    get:
      summary: Obtener comentarios destacados de casos importantes
      description: Devuelve hasta 15 comentarios marcados con "estrella" pertenecientes a casos importantes, ordenados por prioridad (High, Medium, Low).
      responses:
        '200':
          description: Lista de comentarios destacados obtenidos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StarredComment'
        '500':
          $ref: '#/components/responses/500InternalError'

  /cases/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: ID numérico del caso
        schema:
          type: integer
    get:
      summary: Obtener un caso por ID
      description: Devuelve los detalles de un caso específico incluyendo su lista de comentarios y archivos adjuntos.
      responses:
        '200':
          description: Detalles del caso encontrados
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CaseResponse'
                  - type: object
                    properties:
                      comments:
                        type: array
                        items:
                          $ref: '#/components/schemas/Comment'
                      attachments:
                        type: array
                        items:
                          $ref: '#/components/schemas/Attachment'
        '404':
          $ref: '#/components/responses/404NotFound'
        '500':
          $ref: '#/components/responses/500InternalError'
          
    put:
      summary: Actualizar un caso completo
      description: Modifica los datos del caso. Si el estado cambia a "Closed", remueve de forma automática la importancia del caso y desmarca sus comentarios destacados.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaseCreate'
      responses:
        '200':
          description: Caso actualizado correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Case updated successfully
                  case:
                    $ref: '#/components/schemas/CaseResponse'
        '400':
          description: Error de validación o número de caso duplicado
        '500':
          $ref: '#/components/responses/500InternalError'

    patch:
      summary: Actualizar parcialmente el estado de un caso (Prueba)
      description: Endpoint de prueba rápido para cambiar el estado (`status`) de un caso específico.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  example: In Progress
      responses:
        '200':
          description: Estado actualizado
        '400':
          description: Faltan parámetros obligatorios
          
    delete:
      summary: Eliminar un caso
      description: Borra el caso de la base de datos y elimina físicamente del almacenamiento local todos sus archivos adjuntos.
      responses:
        '200':
          description: Caso y archivos eliminados exitosamente
        '500':
          $ref: '#/components/responses/500InternalError'

  /cases/{id}/importance:
    patch:
      summary: Cambiar importancia de un caso
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - is_important
              properties:
                is_important:
                  type: boolean
                  example: true
      responses:
        '200':
          description: Importancia modificada con éxito

  /cases/{id}/attachments:
    post:
      summary: Subir un archivo adjunto al caso
      description: Sube un archivo físico asociado a un caso usando codificación `multipart/form-data`.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: Archivo físico a cargar
      responses:
        '201':
          description: Archivo cargado con éxito
        '400':
          description: No se detectó ningún archivo en la petición
        '404':
          description: El caso especificado no existe

  /attachments/{filename}:
    get:
      summary: Descargar o visualizar archivo adjunto
      parameters:
        - name: filename
          in: path
          required: true
          schema:
            type: string
            example: 1718900000-archivo.pdf
      responses:
        '200':
          description: Retorna el flujo binario del archivo (Stream)
          headers:
            Content-Disposition:
              schema:
                type: string
                example: inline; filename="soporte.pdf"
        '404':
          description: El archivo no existe en base de datos o en el disco

  /attachments/{id}:
    delete:
      summary: Eliminar un archivo adjunto por ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Archivo eliminado del disco y base de datos

  /cases/{id}/comments:
    post:
      summary: Agregar un comentario a un caso
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - content
              properties:
                content:
                  type: string
                  example: "El cliente menciona que el error persiste en producción."
                priority:
                  type: string
                  enum: [High, Medium, Low]
                  default: Medium
      responses:
        '201':
          description: Comentario creado con éxito

  /comments/{id}/star:
    patch:
      summary: Alternar destacado (estrella) de un comentario
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - is_starred
              properties:
                is_starred:
                  type: integer
                  enum: [0, 1]
                  example: 1
      responses:
        '200':
          description: Estado de destacado actualizado

  /comments/{id}:
    delete:
      summary: Eliminar un comentario
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Comentario borrado con éxito

  /products:
    get:
      summary: Listar todos los productos disponibles
      responses:
        '200':
          description: Lista de productos ordenada alfabéticamente
    post:
      summary: Crear un nuevo producto
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  example: "SwaggerHub On-Premise"
                description:
                  type: string
                  example: "Instancia local para despliegues empresariales"
      responses:
        '201':
          description: Producto creado con éxito

  /products/{id}:
    delete:
      summary: Eliminar un producto
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Producto eliminado exitosamente

  /documentation:
    get:
      summary: Listar todos los registros de documentación
    post:
      summary: Crear registro de documentación vinculada a un producto
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - product_id
                - documentation_url
                - description
              properties:
                product_id:
                  type: integer
                  example: 1
                documentation_url:
                  type: string
                  example: "https://support.smartbear.com/swaggerhub/docs/"
                description:
                  type: string
                  example: "Manual oficial de usuario"
                labels:
                  type: string
                  example: "docs,help,guide"
      responses:
        '201':
          description: Documentación registrada con éxito

  /documentation/{id}:
    get:
      summary: Obtener registro de documentación por ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
    put:
      summary: Actualizar registro de documentación completo
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
    delete:
      summary: Eliminar registro de documentación

components:
  responses:
    500InternalError:
      description: Error interno del servidor
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    404NotFound:
      description: El recurso solicitado no existe
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    CaseCreate:
      type: object
      required:
        - case_number
        - status
        - description
      properties:
        case_number:
          type: string
          example: "CS-002345"
        status:
          type: string
          example: "Open"
        description:
          type: string
          example: "El cliente reporta lentitud en el validador de OpenAPI de SwaggerHub."
        root_cause:
          type: string
          nullable: true
          example: "Sintaxis YAML mal estructurada en referencias circulares."
        jira_ticket_url:
          type: string
          nullable: true
          example: "https://jira.com/browse/SWG-4902"
        salesforce_url:
          type: string
          nullable: true
          example: "https://salesforce.com/case/0034512"
        labels:
          type: string
          nullable: true
          example: "validator,yaml,high-priority"
        product_id:
          type: integer
          nullable: true
          example: 1

    CaseResponse:
      allOf:
        - type: object
          properties:
            id:
              type: integer
              example: 1
            is_important:
              type: integer
              enum: [0, 1]
              example: 1
            product_name:
              type: string
              nullable: true
              example: "SwaggerHub SaaS"
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
        - $ref: '#/components/schemas/CaseCreate'

    Comment:
      type: object
      properties:
        id:
          type: integer
          example: 5
        case_id:
          type: integer
          example: 1
        content:
          type: string
        priority:
          type: string
          example: "High"
        is_starred:
          type: integer
          enum: [0, 1]
        created_at:
          type: string
          format: date-time

    StarredComment:
      type: object
      properties:
        id:
          type: integer
        content:
          type: string
        priority:
          type: string
        is_starred:
          type: integer
        created_at:
          type: string
        case_number:
          type: string
        status:
          type: string
        case_id:
          type: integer

    Attachment:
      type: object
      properties:
        id:
          type: integer
        case_id:
          type: integer
        filename:
          type: string
        original_filename:
          type: string
        file_size:
          type: integer
        mime_type:
          type: string
        created_at:
          type: string
          format: date-time

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          example: "Failed to fetch cases"
